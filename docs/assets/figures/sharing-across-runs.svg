<text x="540" y="413" class="label" text-anchor="middle">Run r′ has its own zᵣ′(t). It reuses hₘ, h_q and the fitted Wᵢₘ, Wⱼₘ, Wᵢq.</text>
<text x="540" y="447" class="note" text-anchor="middle">No participant graph. No participant-specific training trajectory. No cross-run convolution.</text>
<text x="540" y="476" class="note" text-anchor="middle">At test time, decode each participant independently when measuring alignment.</text>
