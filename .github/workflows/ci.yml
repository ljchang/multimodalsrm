name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, policy and package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/ci_policy.py
      - id: scope
        run: python scripts/ci_policy.py
      - run: python -m pip install 'pytest>=9' 'packaging>=24' 'ruff>=0.11' 'build>=1.2' 'twine>=6' 'PyYAML>=6'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -I -m pytest -q tests/infrastructure --ignore=tests/infrastructure/test_package.py
      - run: python scripts/check_release.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install -r requirements-docs.txt
      - run: zensical build --clean --strict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.scope.outputs.profile == 'code'
        with:
          name: pr-distributions
          path: dist/*
          if-no-files-found: error

  core:
    name: Core regressions (Linux wheel)
    needs: quality
    if: needs.quality.outputs.profile == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            examples/r_quickstart.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-distributions
          path: dist
      - run: |
          for wheel in dist/*.whl; do python -m pip install "${wheel}[test]"; done
          python -m pip check
          python -I -m pytest -q tests/infrastructure/test_package.py
          python scripts/run_model_tests.py core
          python -I examples/r_quickstart.py

  bayesian:
    name: Bayesian smoke (Linux wheel)
    needs: quality
    if: needs.quality.outputs.profile == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_ENABLE_X64: 'true'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/smoke-tests.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-distributions
          path: dist
      - run: |
          for wheel in dist/*.whl; do python -m pip install "${wheel}[test,bayesian]"; done
          python -m pip check
          python scripts/run_model_tests.py bayesian --smoke
          python -I examples/gp_map_quickstart.py

  required:
    name: Required checks
    if: always()
    needs: [quality, core, bayesian]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROFILE: ${{ needs.quality.outputs.profile }}
      QUALITY: ${{ needs.quality.result }}
      CORE: ${{ needs.core.result }}
      BAYESIAN: ${{ needs.bayesian.result }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/ci_policy.py --check-results
