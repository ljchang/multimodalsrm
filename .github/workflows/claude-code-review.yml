name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Automated review
    # Secrets are withheld from fork PRs, so the review cannot run there.
    # Skip explicitly rather than failing with an auth error.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        env:
          # The review skill launches background subagents and then ends its turn to
          # await them. The action runs Claude as a single-shot SDK call, so ending the
          # turn ends the process and those agents are killed before reporting. Force
          # the review into the foreground so it completes within the one invocation.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools REPLACES the default tool set rather than adding to it, and
          # permissionMode is "default", so anything absent is auto-denied in CI. Skill
          # must be listed or /code-review never starts; the skill's own allowed-tools
          # frontmatter grants what it needs once running.
          claude_args: '--allowedTools "Skill,mcp__github_inline_comment__create_inline_comment"'
