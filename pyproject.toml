[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodalsrm"
dynamic = ["version"]
description = "Shared response models for native-time multimodal observations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Luke J. Chang"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4",
  "joblib>=1.3", "threadpoolctl>=3",
]

[project.optional-dependencies]
bayesian = ["jax==0.11.2", "jaxlib==0.11.2", "numpyro==0.22.0"]
bayesian-cuda = [
  "multimodalsrm[bayesian]",
  "jax[cuda13]==0.11.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
plots = ["matplotlib>=3.8"]
test = ["pytest>=9", "packaging>=24", "matplotlib>=3.8", "psutil>=5.9", "arviz==1.3.0"]
dev = [
  "pytest>=9", "packaging>=24", "matplotlib>=3.8", "psutil>=5.9", "arviz==1.3.0",
  "ruff>=0.11", "build>=1.2", "twine>=6", "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/ljchang/multimodalsrm"
Documentation = "https://ljchang.github.io/multimodalsrm/"
Repository = "https://github.com/ljchang/multimodalsrm"
Issues = "https://github.com/ljchang/multimodalsrm/issues"
Changelog = "https://github.com/ljchang/multimodalsrm/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["multimodalsrm*"]

[tool.setuptools.dynamic]
version = {attr = "multimodalsrm._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
